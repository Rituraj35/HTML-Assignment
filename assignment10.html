<!DOCTYPE html>
<html>
    <head>
        <title>Multimedia: Image, Video, Audio and YouTube</title>
    </head>
    <body>
        <h3>Image</h3>
        <img src="asssignment10image.jpg" alt="College campus" width="300" height="200">
        <h3>Video</h3>
        <video width="320" height="240" controls>
            <source src="sample-video.mp4" type="video/mp4">
        </video>
        <h3>Audio</h3>
        <audio controls>
            <source src="sample-audio.mp3" type="audio/mpeg">
        </audio>
        <h3>You Tube</h3>
        <iframe width="320" height="215" src="https://youtube.com" title="Youtube video player" allowfullscreen></iframe>
    </body>
</html>
