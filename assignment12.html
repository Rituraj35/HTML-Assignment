<!DOCTYPE html>
<html>
    <head>
        <title>Table with Headers, Caption and Footer</title>
    </head>
    <body>
        <table border="2" cellpadding="5" cellspecing="0" width="50%">
            <caption>Student Marks</caption>
            <tr>
                <th>Roll</th>
                <th>Name</th>
                <th>Marks</th>
            </tr>
            <tr align="center">
                <td>1</td>
                <td>Aman</td>
                <td>85</td>
            </tr>
            <tr align="center">
                <td>2</td>
                <td>Riya</td>
                <td>92</td>
            </tr>
            <tr align="center">
                <td colspan="2">Average</td>
                <td>88.5</td>
            </tr>
        </table>
    </body>
</html>
