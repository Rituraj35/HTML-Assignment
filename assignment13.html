<!DOCTYPE html>
<html>
    <head>
        <title>Rowspan and Colspan (Timetable)</title>
    </head>
    <body>
        <table border="2" cellpadding="5" width="50%">
            <caption><b>Weekly Timetable</b></caption>
            <tr align="center">
                <th>Day</th>
                <th>9-10</th>
                <th>10-11</th>
                <th>11-12</th>
            </tr>
            <tr align="center">
                <td>Mon</td>
                <td>Maths</td>
                <td>HTML</td>
                <td rowspan="2">Web Lab</td>
            </tr>
            <tr align="center">
                <td>Tue</td>
                <td>DBMS</td>
                <td>OS</td>
            </tr>
            <tr align="center">
                <td>Wed</td>
                <td colspan="3">Seminar</td>
            </tr>
        </table> 
    </body>
</html>
