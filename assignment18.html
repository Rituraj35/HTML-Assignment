<!DOCTYPE html>
<html>
    <head>
        <title>Mini Project: Accessible Student Admission Page</title>
    </head>
    <body>
    <table width="100%" bgcolor="#1a237e" cellpadding="15" cellspacing="0">
    <tr>
      <td align="center">
        <font color="white" size="6"><b>ABC College Admission 2026</b></font>
      </td>
    </tr>
    </table>

    <br>

    <table width="75%" align="center" cellpadding="10" cellspacing="0">
    <tr>
      <td>
        <h2>Courses and Fees</h2>

        <table width="100%" border="1" cellpadding="8" cellspacing="0">
          <caption>Available Courses</caption>
          <thead>
            <tr bgcolor="#e8eaf6">
              <th>Course</th>
              <th>Seats</th>
              <th>Fees</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>B.Tech CSE</td>
              <td>120</td>
              <td>&#8377;90,000</td>
            </tr>
            <tr>
              <td>BCA</td>
              <td>60</td>
              <td>&#8377;45,000</td>
            </tr>
          </tbody>
        </table>

        <br><br>

        <form>
          <fieldset>
            <legend>Application Form</legend>

            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" size="40"><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" size="40"><br><br>

            <label for="course">Course:</label><br>
            <select id="course" name="course">
              <option value="btech">B.Tech CSE</option>
              <option value="bca">BCA</option>
            </select><br><br>

            <label for="statement">Statement:</label><br>
            <textarea id="statement" name="statement" rows="4" cols="65"></textarea><br><br>

            <input type="submit" value="Apply">
          </fieldset>
        </form>
      </td>
    </tr>
  </table>

  <br><br>

  <table width="100%" bgcolor="#1a237e" cellpadding="12" cellspacing="0">
    <tr>
      <td align="center">
        <font color="white">&copy; 2026 ABC College</font>
      </td>
    </tr>
    </table>
    </body>
</html>
